version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: posbilling_postgres
    environment:
      POSTGRES_USER: posbilling
      POSTGRES_PASSWORD: posbilling123
      POSTGRES_DB: posbilling_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posbilling"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
